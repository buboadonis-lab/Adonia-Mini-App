<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b53e0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14131c" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Adonia Mini App — browse the product catalog, search, and build your cart." />
  <title>Adonia — Shop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235b53e0'/%3E%3Ctext x='50' y='70' font-size='58' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <!-- telegram-web-app.js is only fetched when the page is actually opened inside
       Telegram (detected from the tgWebApp* launch parameters) — see app.js. -->
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#catalog">Skip to products</a>

  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">A</span>
        <span class="brand__text">
          <strong id="storeName">Adonia</strong>
          <small id="storeSub">Product catalog</small>
        </span>
      </div>

      <div class="header-actions">
        <button type="button" id="refreshButton" class="icon-button" title="Reload products from data.json" aria-label="Reload products">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>

    <div class="app-header__inner app-header__search">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input
          type="search"
          id="searchInput"
          class="search__input"
          placeholder="Search products…"
          autocomplete="off"
          enterkeyhint="search"
          aria-label="Search products"
        />
        <button type="button" id="clearSearch" class="search__clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <nav class="chips" id="categoryChips" aria-label="Filter by category"></nav>
  </header>

  <main class="app-main" id="appMain">
    <div class="app-main__inner">
      <div class="results-bar">
        <p class="results-bar__count" id="resultCount" aria-live="polite">Loading products…</p>
        <p class="results-bar__updated" id="updatedAt"></p>
      </div>

      <!-- Loading / error / empty states -->
      <section class="state" id="stateBox" aria-live="polite">
        <div class="state__spinner" aria-hidden="true"></div>
        <h2 class="state__title" id="stateTitle">Loading products…</h2>
        <p class="state__text" id="stateText">Fetching the latest catalog from data.json.</p>
        <button type="button" class="button button--primary" id="stateAction" hidden>Try again</button>
      </section>

      <section id="catalog" class="grid" aria-label="Products"></section>
    </div>
  </main>

  <!-- Cart bar: docks below the catalog so it never covers the product buttons.
       Hidden while the cart is empty, slides in with the first item. -->
  <div class="cart-bar" id="cartBar" hidden>
    <div class="cart-bar__inner">
      <button type="button" class="cart-bar__button" id="cartButton" aria-haspopup="dialog" aria-label="Review cart">
        <span class="cart-bar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"/>
            <circle cx="10" cy="20" r="1.4"/>
            <circle cx="18" cy="20" r="1.4"/>
          </svg>
          <span class="cart-bar__count" id="cartCount">0</span>
        </span>
        <span class="cart-bar__labels">
          <strong id="cartBarTitle">Cart</strong>
          <small id="cartBarSub">Review your items</small>
        </span>
        <span class="cart-bar__total" id="cartBarTotal">—</span>
      </button>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden></div>

  <!-- Cart drawer -->
  <aside class="cart-panel" id="cartPanel" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
    <header class="cart-panel__header">
      <h2 id="cartTitle">Your cart <span class="cart-panel__badge" id="cartPanelCount">0</span></h2>
      <button type="button" class="icon-button" id="closeCart" aria-label="Close cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div class="cart-panel__body" id="cartItems"></div>

    <footer class="cart-panel__footer">
      <div class="summary-row">
        <span>Items</span>
        <span id="summaryItems">0</span>
      </div>
      <div class="summary-row summary-row--total">
        <span>Total</span>
        <span id="summaryTotal">—</span>
      </div>
      <button type="button" class="button button--primary button--block" id="checkoutButton">
        Checkout
      </button>
      <button type="button" class="button button--ghost button--block" id="clearCartButton">
        Clear cart
      </button>
    </footer>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
